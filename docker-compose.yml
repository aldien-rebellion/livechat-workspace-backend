services:
  postgres:
    image: postgres:15-alpine
    container_name: livechat_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: livechat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: livechat_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: livechat_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    container_name: livechat_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PROJECT_NAME=LiveChat Workspace Backend
      - API_V1_STR=/api/v1
      - PORT=8080
      - HOST=0.0.0.0
      - DEBUG=True
      - SECRET_KEY=development-secret-key-1234567890
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/livechat_db
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: livechat_worker
    restart: always
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
  redis_data:
