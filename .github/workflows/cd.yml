name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image and push to Docker Hub
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iot-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iot-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: SSH into the Cloud Server and pull + restart the container
  # Runs only after build-and-push succeeds
  # ──────────────────────────────────────────────────────────────────────────
  deploy-to-server:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH Deploy via appleboy/ssh-action
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Move to app directory (try absolute path first, fallback to ~/app)
            cd /home/ubuntu/app || cd ~/app

            # Pull the freshly-built image from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/iot-api:latest

            # Write the required env var so docker-compose.prod.yml can resolve ${DOCKERHUB_USERNAME}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            # Start / restart services; remove stale containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Quick smoke-test: wait for the container and hit /health
            sleep 5
            curl -sf http://localhost:8000/health || \
              (echo "Health check failed after deploy!" && exit 1)

            echo "✅ Deployment successful – $(date)"
